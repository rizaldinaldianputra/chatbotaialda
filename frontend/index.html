<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alda - AI Assistant</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    
    <div class="chat-container">
        <header class="chat-header">
            <div class="avatar-container">
                <div class="avatar">A</div>
                <div class="online-indicator"></div>
            </div>
            <div class="header-info">
                <h1>Alda</h1>
                <span class="status">Always here to help</span>
            </div>
        </header>
        
        <main class="chat-box" id="chat-box">
            <div class="message alda-message welcome-msg">
                <div class="msg-content">
                    Halo! Aku Alda. Senang bertemu denganmu. Ada yang bisa kubantu hari ini?
                </div>
            </div>
        </main>
        
        <footer class="chat-input-area">
            <form id="chat-form">
                <input type="text" id="user-input" placeholder="Tanyakan sesuatu pada Alda..." autocomplete="off" required>
                <button type="submit" id="send-btn">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </form>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
